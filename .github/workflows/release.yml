name: Build and Push

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - ".github/instructions/**"
      - "docs/**"
      - "*.md"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Override image tag (leave empty for auto)"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/music-assistant-server-fork

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel:
          - stable
          - beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from pyproject.toml and update
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          with open('pyproject.toml') as f:
              content = f.read()
          # Extract current version or derive from git tags
          m = re.search(r'^version = \"([^\"]+)\"', content, re.MULTILINE)
          v = m.group(1) if m else '0.0.0'
          if v == '0.0.0':
              import subprocess, os
              tags = subprocess.check_output(['git', 'tag', '--sort=-v:refname']).decode().strip().split('\n')
              if tags and tags[0]:
                  v = tags[0].lstrip('v')
              else:
                  v = f'0.0.0.dev{int(os.environ.get(\"GITHUB_RUN_NUMBER\", \"1\"))}'
          # Update pyproject.toml in-place
          content = re.sub(r'^version = .*$', f'version = \"{v}\"', content, flags=re.MULTILINE)
          with open('pyproject.toml', 'w') as f:
              f.write(content)
          print(v)
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set build tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ matrix.channel }}"
          
          TAGS=""
          # Versioned tag (always)
          TAGS="${TAGS}ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}"
          
          if [ "$CHANNEL" = "stable" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:latest"
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:stable"
          else
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:beta"
          fi

          # On dev branch, also add dev tag
          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:dev"
          fi

          # Release tag if published
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:${TAG#v}"
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Set up Python for building
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel distribution
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_IMAGE_VERSION=latest
            MASS_VERSION=${{ steps.version.outputs.version }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
