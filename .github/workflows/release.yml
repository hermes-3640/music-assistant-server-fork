name: release

# Every push to main that passes the tests is a release. The version is the
# upstream release main is built on plus a build number (tools/release-version),
# the commit is tagged with it, and the image is published for amd64 and arm64.
on:
  push:
    branches: [main]

permissions:
  contents: write # pushing the release tag
  packages: write # pushing the image

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The base image the server image is built on. Upstream versions its base
  # separately from the server, and 1.6.3 is what upstream's own 2.10.6 release
  # builds on (BASE_IMAGE_VERSION_STABLE in their .github/workflows/release.yml).
  BASE_IMAGE_VERSION: "1.6.3"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pep440: ${{ steps.version.outputs.pep440 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-version needs the full history and the tags
      - id: version
        name: Work out this commit's version
        run: |
          set -eu
          echo "version=$(tools/release-version)" >> "$GITHUB_OUTPUT"
          echo "pep440=$(tools/release-version --pep440)" >> "$GITHUB_OUTPUT"

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set the version the program reports
        # X.Y.Z+hermes.N is a PEP 440 local version, so it sorts with X.Y.Z
        # rather than below it the way the -N release tag would.
        run: sed -i "s|^version = .*|version = \"${{ needs.version.outputs.pep440 }}\"|" pyproject.toml
      - name: Build the wheel
        # The Dockerfile installs from dist/, so the wheel has to exist first.
        run: uv build --wheel --out-dir dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE_VERSION=${{ env.BASE_IMAGE_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the release commit
        run: |
          set -eu
          git tag "${{ needs.version.outputs.version }}"
          git push origin "${{ needs.version.outputs.version }}"
