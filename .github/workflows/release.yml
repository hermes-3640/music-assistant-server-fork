name: Build and Push

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - ".github/workflows/*.yml"
      - ".github/instructions/**"
      - "docs/**"
      - "*.md"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Override image tag (leave empty for auto)"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/music-assistant-server-fork

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel:
          - stable
          - beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1639ceacfbe6211717f4d48ae1 # v4.2.2

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          v = data['project']['version']
          # If version is 0.0.0, derive from most recent tag or use dev tag
          if v == '0.0.0':
              import subprocess, os
              tags = subprocess.check_output(['git', 'tag', '--sort=-v:refname']).decode().strip().split('\n')
              if tags and tags[0]:
                  print(tags[0].lstrip('v'))
              else:
                  print(f'0.0.0.dev{int(os.environ.get(\"GITHUB_RUN_NUMBER\", \"1\"))}')
          else:
              print(v)
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set build tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ matrix.channel }}"
          
          TAGS=""
          # Versioned tag (always)
          TAGS="${TAGS}ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}"
          
          if [ "$CHANNEL" = "stable" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:latest"
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:stable"
          else
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:beta"
          fi

          # On dev branch, also add dev tag
          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:dev"
          fi

          # Release tag if published
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:${TAG#v}"
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c230636eaf90 # v3.3.0
        with:
          driver-opts: |
            image=moby/buildkit:master

      - name: Build and push Docker image
        uses: docker/build-push-action@05f707856820cc527730a821e1a99733639ba662 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_IMAGE_VERSION=latest
            MASS_VERSION=${{ steps.version.outputs.version }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
